server:
  port: 8085

spring:
  config:
    # Lets local development load SMTP settings from backend/plts/.env.
    # Environment variables still take precedence in deployed environments.
    import: optional:file:./.env[.properties]
  application:
    name: plts
  datasource:
    url: jdbc:h2:mem:pltsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    # Gmail SSL SMTP. Override with 587 and enable STARTTLS when your network permits it.
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:productlifecycle4@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:efkpyltfpyqdzevh}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${SPRING_MAIL_SSL_ENABLE:true}
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:5000}

app:
  mail:
    from: ${MAIL_FROM:${SPRING_MAIL_USERNAME:productlifecycle4@gmail.com}}
  jwt:
    secret: PLTS_ENTERPRISE_SUPER_SECURE_JWT_SECRET_KEY_FOR_PRODUCT_LIFECYCLE_TRACEABILITY_SYSTEM_2026
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
